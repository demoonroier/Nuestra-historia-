<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rogelio & Monse ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    color: #5a2340;
    text-align: center;
    overflow-x: hidden;
}

.container {
    padding: 50px 20px;
}

h1 {
    font-size: 45px;
    color: #d63384;
}

h2 {
    font-weight: normal;
}

.card {
    background: rgba(255,255,255,0.8);
    padding: 30px;
    border-radius: 25px;
    max-width: 600px;
    margin: 30px auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.heart {
    position: fixed;
    bottom: -20px;
    animation: subir 8s linear infinite;
    color: #ff4d88;
    font-size: 25px;
}

@keyframes subir {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

#contador {
    font-size: 22px;
    color: #c2185b;
}
</style>

</head>

<body>

<div class="container">

<h1>Rogelio & Monse ❤️</h1>

<div class="card">

<h2>Nuestra historia 💕</h2>

<p>
Desde aquel 9 de octubre de 2024 comenzó una historia especial.
Cada momento, cada risa y cada recuerdo forman parte de nosotros.
</p>

<h2>Tiempo juntos ⏳</h2>

<p id="contador"></p>

</div>

</div>


<script>

const inicio = new Date("2024-10-09T00:00:00");

function actualizar(){

const ahora = new Date();

const diferencia = ahora - inicio;

const dias = Math.floor(diferencia / (1000*60*60*24));

const horas = Math.floor((diferencia / (1000*60*60)) % 24);

const minutos = Math.floor((diferencia / (1000*60)) % 60);

const segundos = Math.floor((diferencia / 1000) % 60);


document.getElementById("contador").innerHTML =
dias + " días, " +
horas + " horas, " +
minutos + " minutos y " +
segundos + " segundos ❤️";

}

setInterval(actualizar,1000);

actualizar();


// corazones

function crearCorazon(){

const corazon = document.createElement("div");

corazon.className="heart";

corazon.innerHTML="❤️";

corazon.style.left=Math.random()*100+"vw";

corazon.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(corazon);


setTimeout(()=>{

corazon.remove();

},10000);

}

setInterval(crearCorazon,500);

</script>


</body>
</html>
